<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARLO 0225 — Comcast print overlay</title><style>body{margin:0;font:16px system-ui;background:#111;color:#ddd;display:flex;align-items:center;justify-content:center;height:100vh} </style></head><body><p>Loading map&hellip;</p><script>
(async()=>{
  const N=4, parts=[];
  for(let i=0;i<N;i++){ const r=await fetch('part-'+String(i).padStart(2,'0')+'.html'); if(!r.ok) throw new Error('missing part '+i+' ('+r.status+')'); parts.push(await r.text()); }
  document.open(); document.write(parts.join('')); document.close();
})().catch(e=>{document.body.innerHTML='<p style="padding:20px">Map failed to load: '+e.message+'. Try reloading.</p>';});
</script></body></html>
